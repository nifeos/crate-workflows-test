name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, matching the manifest (e.g. 0.1.0).
        required: true
        type: string
      dry-run:
        description: Rehearse without tagging or publishing.
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: nifeos/crate-workflows/.github/workflows/release.yml@91eb0a9d068dbaf6d63175c7fb0e7ec59fce9dc4
    with:
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
