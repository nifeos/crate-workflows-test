name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, matching the manifest (e.g. 0.1.0).
        required: true
        type: string
      dry-run:
        description: Rehearse without tagging or publishing.
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: nifeos/crate-workflows/.github/workflows/release.yml@b44a45ae8eb1fde179380303f61aeade1a7bcb87
    with:
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
